<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gmail - AI Productivity Assistant</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Roboto & Google Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="h-screen flex flex-col bg-[#f6f8fc]">

  <!-- Top Header Bar -->
  <header class="h-16 flex items-center justify-between px-4 flex-shrink-0 bg-[#f6f8fc] border-b border-gray-200/60 z-20">
    
    <!-- Left Section: Logo & Toggle -->
    <div class="flex items-center gap-3 w-64">
      <button id="btn-sidebar-toggle" class="p-2.5 hover:bg-gray-200/70 rounded-full text-gray-600 transition" title="Main menu">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>

      <!-- Gmail Logo & Brand -->
      <a href="/" class="flex items-center gap-2 select-none">
        <svg viewBox="0 0 48 48" class="w-8 h-8">
          <path fill="#4caf50" d="M45,16.2l-5,2.75l-5,4.75L35,40h7c1.657,0,3-1.343,3-3V16.2z"/>
          <path fill="#1e88e5" d="M3,16.2l3.614,1.71L13,23.7V40H6c-1.657,0-3-1.343-3-3V16.2z"/>
          <polygon fill="#e53935" points="35,11.2 24,19.45 13,11.2 12,17 13,23.7 24,31.95 35,23.7 36,17"/>
          <path fill="#c62828" d="M3,12.298V16.2l10,7.5V11.2L6.787,6.541C5.234,5.376,3,6.484,3,8.423V12.298z"/>
          <path fill="#fbc02d" d="M45,12.298V16.2l-10,7.5V11.2l6.213-4.659C42.766,5.376,45,6.484,45,8.423V12.298z"/>
        </svg>
        <span class="google-sans text-xl font-normal text-gray-700 tracking-tight">Gmail</span>
        <span class="text-[10px] bg-blue-100 text-blue-700 font-semibold px-1.5 py-0.5 rounded ml-1 tracking-wide">AI PREP</span>
      </a>
    </div>

    <!-- Center Section: Gmail Pill Search Bar -->
    <div class="flex-1 max-w-2xl px-2">
      <form id="search-form" class="relative flex items-center">
        <button type="submit" class="absolute left-3.5 p-1 text-gray-500 hover:text-gray-700">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </button>
        <input 
          type="text" 
          id="search-input" 
          placeholder="Search in mail" 
          class="w-full pl-12 pr-10 py-2.5 rounded-full bg-[#eaf1fb] hover:bg-[#e3ecfa] focus:bg-white text-sm text-gray-800 placeholder-gray-500 focus:outline-none focus:ring-1 focus:ring-blue-400 focus:shadow-md transition-all duration-150"
        />
      </form>
    </div>

    <!-- Right Section: User Profile & Actions -->
    <div class="flex items-center gap-3 w-64 justify-end">
      <!-- Status Badge -->
      <div class="hidden md:flex items-center gap-1.5 px-2.5 py-1 bg-emerald-50 border border-emerald-200 rounded-full text-[11px] text-emerald-700 font-medium">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span>Connected</span>
      </div>

      <!-- User Avatar / Email -->
      <div class="flex items-center gap-2 pl-2">
        <div id="user-avatar" class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center font-medium text-xs shadow-sm">
          U
        </div>
        <div class="hidden lg:block text-left text-xs">
          <div id="user-email" class="font-medium text-gray-800 max-w-[120px] truncate">user@gmail.com</div>
        </div>
      </div>

      <!-- Logout Button -->
      <a href="/auth/logout" class="p-2 text-gray-500 hover:text-red-600 hover:bg-gray-200/60 rounded-full transition" title="Sign Out">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
      </a>
    </div>

  </header>

  <!-- Main Body Content -->
  <div class="flex-1 flex overflow-hidden">

    <!-- Left Sidebar -->
    <aside id="sidebar" class="w-64 flex flex-col justify-between py-3 px-3 flex-shrink-0 select-none bg-[#f6f8fc]">
      
      <div>
        <!-- Compose Floating Pill Button -->
        <button class="flex items-center gap-3.5 px-6 py-4 bg-[#c2e7ff] hover:bg-[#b3defa] text-[#001d35] rounded-2xl shadow-sm hover:shadow-md transition-all duration-200 font-medium text-sm mb-4 w-fit" onclick="alert('Compose & AI Drafting will be enabled in the upcoming assistant integration!');">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
          </svg>
          <span class="tracking-wide">Compose</span>
        </button>

        <!-- Navigation Folders -->
        <nav class="space-y-0.5 text-sm">
          
          <!-- Inbox -->
          <button class="nav-item active w-full flex items-center justify-between px-6 py-2.5 rounded-full text-gray-700 hover:bg-[#eaebef] transition-colors" data-folder="INBOX">
            <div class="flex items-center gap-4">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" />
              </svg>
              <span>Inbox</span>
            </div>
            <span class="badge-inbox text-xs font-bold text-gray-800 hidden"></span>
          </button>

          <!-- Starred -->
          <button class="nav-item w-full flex items-center justify-between px-6 py-2.5 rounded-full text-gray-700 hover:bg-[#eaebef] transition-colors" data-folder="STARRED">
            <div class="flex items-center gap-4">
              <svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" />
              </svg>
              <span>Starred</span>
            </div>
          </button>

          <!-- Sent -->
          <button class="nav-item w-full flex items-center justify-between px-6 py-2.5 rounded-full text-gray-700 hover:bg-[#eaebef] transition-colors" data-folder="SENT">
            <div class="flex items-center gap-4">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
              </svg>
              <span>Sent</span>
            </div>
          </button>

          <!-- Drafts -->
          <button class="nav-item w-full flex items-center justify-between px-6 py-2.5 rounded-full text-gray-700 hover:bg-[#eaebef] transition-colors" data-folder="DRAFT">
            <div class="flex items-center gap-4">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
              </svg>
              <span>Drafts</span>
            </div>
            <span class="badge-draft text-xs font-semibold text-gray-600 hidden"></span>
          </button>

          <!-- Trash -->
          <button class="nav-item w-full flex items-center justify-between px-6 py-2.5 rounded-full text-gray-700 hover:bg-[#eaebef] transition-colors" data-folder="TRASH">
            <div class="flex items-center gap-4">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
              </svg>
              <span>Trash</span>
            </div>
          </button>

          <!-- Spam -->
          <button class="nav-item w-full flex items-center justify-between px-6 py-2.5 rounded-full text-gray-700 hover:bg-[#eaebef] transition-colors" data-folder="SPAM">
            <div class="flex items-center gap-4">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
              </svg>
              <span>Spam</span>
            </div>
          </button>

        </nav>

        <!-- Labels Divider -->
        <div class="mt-6 pt-4 border-t border-gray-200/80 px-4">
          <div class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Labels</div>
          <div class="space-y-1 text-xs text-gray-600">
            <div class="flex items-center gap-2.5 py-1.5 px-2 rounded hover:bg-gray-200/50 cursor-pointer">
              <span class="w-2.5 h-2.5 rounded-sm bg-blue-500"></span>
              <span>AI Summarized</span>
            </div>
            <div class="flex items-center gap-2.5 py-1.5 px-2 rounded hover:bg-gray-200/50 cursor-pointer">
              <span class="w-2.5 h-2.5 rounded-sm bg-amber-500"></span>
              <span>Needs Approval</span>
            </div>
          </div>
        </div>

      </div>

      <!-- Sidebar Footer -->
      <div class="px-4 py-2 text-[11px] text-gray-400">
        <div>Gmail API Connected</div>
        <div class="mt-0.5">Port 5000 Web Client</div>
      </div>

    </aside>

    <!-- Main Content Stage -->
    <main class="flex-1 flex flex-col bg-white rounded-tl-2xl shadow-sm border-t border-l border-gray-200/70 overflow-hidden mr-3 mb-3">
      
      <!-- List View Wrapper -->
      <div id="email-list-wrapper" class="flex-1 flex flex-col overflow-hidden">
        
        <!-- Action Toolbar -->
        <div class="h-12 border-b border-gray-200/80 flex items-center justify-between px-4 bg-white flex-shrink-0 select-none">
          
          <div class="flex items-center gap-2">
            <!-- Select All Checkbox -->
            <div class="p-1.5 hover:bg-gray-100 rounded cursor-pointer">
              <input type="checkbox" id="select-all-cb" class="rounded border-gray-300 text-blue-600 focus:ring-0 cursor-pointer w-4 h-4">
            </div>

            <!-- Normal Action Icons -->
            <div id="normal-actions" class="flex items-center gap-1 text-gray-600">
              <button id="btn-refresh" class="p-2 hover:bg-gray-100 rounded-full transition" title="Refresh">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
              </button>
            </div>

            <!-- Batch Action Icons (Hidden unless emails selected) -->
            <div id="batch-actions" class="hidden flex items-center gap-1 text-gray-600">
              <button id="btn-batch-read" class="p-2 hover:bg-gray-100 rounded-full transition" title="Mark as read">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 19v-8.93a2 2 0 01.89-1.664l7-4.666a2 2 0 012.22 0l7 4.666A2 2 0 0121 10.07V19M3 19a2 2 0 002 2h14a2 2 0 002-2M3 19l6.75-4.5M21 19l-6.75-4.5" />
                </svg>
              </button>
              <button id="btn-batch-trash" class="p-2 hover:bg-gray-100 rounded-full transition text-red-600" title="Delete">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
              </button>
            </div>
          </div>

          <!-- Pagination Controls -->
          <div class="flex items-center gap-3 text-xs text-gray-500">
            <span id="pagination-count">Loading...</span>
            <div class="flex items-center gap-1">
              <button id="btn-prev-page" class="p-1.5 hover:bg-gray-100 rounded-full transition opacity-30" disabled title="Newer">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
              </button>
              <button id="btn-next-page" class="p-1.5 hover:bg-gray-100 rounded-full transition opacity-30" disabled title="Older">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
              </button>
            </div>
          </div>

        </div>

        <!-- Scrollable Email List Content -->
        <div id="email-list-content" class="flex-1 overflow-y-auto divide-y divide-gray-100">
          <!-- Dynamically populated by components.js -->
        </div>

      </div>

      <!-- Thread / Detail View (Hidden by default) -->
      <div id="thread-view-container" class="hidden flex-1 overflow-y-auto">
        <!-- Dynamically populated when email clicked -->
      </div>

    </main>

  </div>

  <!-- Scripts -->
  <script src="/static/js/api.js"></script>
  <script src="/static/js/components.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>

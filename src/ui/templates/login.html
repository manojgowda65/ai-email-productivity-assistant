<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect Gmail - AI Email Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif; }
    .google-sans { font-family: 'Google Sans', 'Roboto', sans-serif; }
  </style>
</head>
<body class="bg-[#f0f4f9] min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-3xl shadow-sm border border-gray-200/80 max-w-md w-full p-8 md:p-10 text-center">
    
    <!-- Gmail Icon SVG -->
    <div class="w-16 h-16 mx-auto mb-6 flex items-center justify-center">
      <svg viewBox="0 0 48 48" class="w-16 h-16">
        <path fill="#4caf50" d="M45,16.2l-5,2.75l-5,4.75L35,40h7c1.657,0,3-1.343,3-3V16.2z"/>
        <path fill="#1e88e5" d="M3,16.2l3.614,1.71L13,23.7V40H6c-1.657,0-3-1.343-3-3V16.2z"/>
        <polygon fill="#e53935" points="35,11.2 24,19.45 13,11.2 12,17 13,23.7 24,31.95 35,23.7 36,17"/>
        <path fill="#c62828" d="M3,12.298V16.2l10,7.5V11.2L6.787,6.541C5.234,5.376,3,6.484,3,8.423V12.298z"/>
        <path fill="#fbc02d" d="M45,12.298V16.2l-10,7.5V11.2l6.213-4.659C42.766,5.376,45,6.484,45,8.423V12.298z"/>
      </svg>
    </div>

    <!-- Title & Subtitle -->
    <h1 class="google-sans text-2xl font-medium text-gray-800 mb-2">
      AI Email Assistant
    </h1>
    <p class="text-sm text-gray-500 mb-8 leading-relaxed">
      Connect your Gmail account to explore your inbox, search messages, and manage email threads in a familiar interface.
    </p>

    {% if error %}
    <div class="mb-6 p-3 bg-red-50 border border-red-200 text-red-600 rounded-xl text-xs text-left">
      <strong>Authentication Notice:</strong> {{ error }}
    </div>
    {% endif %}

    <!-- Connect Button -->
    <a href="/auth/login" 
       class="flex items-center justify-center gap-3 w-full py-3.5 px-6 rounded-full border border-gray-300 hover:border-gray-400 bg-white hover:bg-gray-50 shadow-sm transition-all duration-150 text-gray-700 font-medium text-sm">
      <svg class="w-5 h-5" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      <span>Connect with Google</span>
    </a>

    <!-- Footer info -->
    <div class="mt-8 pt-6 border-t border-gray-100 flex items-center justify-center gap-2 text-xs text-gray-400">
      <span class="inline-block w-2 h-2 rounded-full bg-emerald-500"></span>
      <span>Local OAuth 2.0 Web Client on Port 5000</span>
    </div>

  </div>

</body>
</html>
